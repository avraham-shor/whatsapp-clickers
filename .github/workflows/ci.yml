name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt violations:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...
      - name: Hebrew copy centralization
        # Every outbound WhatsApp string lives in internal/wa/messages_he.go
        # (architecture Enforcement Guidelines) — a Hebrew literal in a handler
        # is a named anti-pattern. Test files are exempt: they legitimately
        # assert on Hebrew fixtures.
        run: |
          # grep -P rejects the codepoint range under a non-UTF-8 locale
          # ("-P supports only unibyte and UTF-8 locales"), which the status
          # guard below would turn into a red build rather than a silent pass.
          export LC_ALL=C.UTF-8
          status=0
          # U+0590-05FF is the Hebrew block; U+FB1D-FB4F the Alphabetic
          # Presentation Forms (precomposed ligatures, e.g. pasted from a
          # PDF) — copy smuggled in that form must not evade the gate.
          hebrew=$(grep -rlP '[\x{0590}-\x{05FF}\x{FB1D}-\x{FB4F}]' --include='*.go' .) || status=$?
          if [ "$status" -gt 1 ]; then
            echo "copy-centralization: grep error (exit $status)"
            exit "$status"
          fi
          # The exemption is anchored to the one real path (grep -rl on .
          # prints ./-prefixed paths) so a future file merely *ending* in
          # internal/wa/messages_he.go is not silently exempt too.
          matches=$(printf '%s\n' "$hebrew" \
            | grep -v '^$' \
            | grep -v '_test\.go$' \
            | grep -v '^\./internal/wa/messages_he\.go$') || true
          if [ -z "$matches" ]; then echo "copy-centralization: clean"; exit 0; fi
          echo "Hebrew literals outside internal/wa/messages_he.go (copy-centralization violation):"
          echo "$matches"
          exit 1

      - name: sqlc generate diff-check
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc generate
          # intent-to-add makes newly generated (untracked) files fail the diff too
          git add -N internal/store/gen
          git diff --exit-code -- internal/store/gen

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: npm ci
        run: npm ci
      - name: eslint
        run: npm run lint
      - name: typecheck
        run: npx tsc -b --noEmit
      - name: vitest
        run: npm test
      - name: build
        run: npm run build
      - name: filter-safety on built bundle (UX-DR4)
        # Bundled node_modules CSS lands in dist — the source scan can't see
        # it, so check the shipped CSS and index.html for external fetches.
        run: |
          status=0
          matches=$(grep -rnE \
            -e 'url\(\s*.?(https?:)?//' \
            -e '@import' \
            -e '(src|href|srcset)\s*=\s*.?.?(https?:)?//' \
            -e 'fonts\.(googleapis|gstatic)' \
            dist/index.html dist/assets/*.css 2>/dev/null) || status=$?
          if [ "$status" -eq 1 ]; then echo "filter-safety (bundle): clean"; exit 0; fi
          if [ "$status" -ne 0 ]; then echo "filter-safety (bundle): grep error (exit $status)"; exit "$status"; fi
          echo "External asset references in built bundle (filter-safety violation, UX-DR4):"
          echo "$matches"
          exit 1

  filter-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No external URL assets (UX-DR4)
        run: |
          status=0
          matches=$(grep -rnE --exclude-dir=node_modules --exclude-dir=dist \
            -e 'url\(\s*.?(https?:)?//' \
            -e '(src|href|srcset)\s*=\s*.?.?(https?:)?//' \
            -e '@import\s+(url\(\s*)?.?.?(https?:)?//' \
            -e 'fonts\.(googleapis|gstatic)' \
            web/) || status=$?
          if [ "$status" -eq 1 ]; then echo "filter-safety: clean"; exit 0; fi
          if [ "$status" -ne 0 ]; then echo "filter-safety: grep error (exit $status)"; exit "$status"; fi
          echo "External asset references found (filter-safety violation, UX-DR4):"
          echo "$matches"
          exit 1
